services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bienestar_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bienestar_dev_2026
      POSTGRES_DB: bienestar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bienestar_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  neo4j:
    image: neo4j:5.18.0
    container_name: bienestar_neo4j
    environment:
      NEO4J_AUTH: neo4j/bienestar_dev_2026
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4jdata:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: bienestar_otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    environment:
      - GRAFANA_OTLP_ENDPOINT=${GRAFANA_OTLP_ENDPOINT:-}
      - GRAFANA_OTLP_TOKEN=${GRAFANA_OTLP_TOKEN:-}

volumes:
  pgdata:
  redisdata:
  neo4jdata:
